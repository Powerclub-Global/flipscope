name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    name: Lint · typecheck · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc -b
      - run: pnpm build

  db:
    name: Migrations + tenant-isolation suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0  # pinned: 'latest' resolution is rate-limited on shared runners
      # Applies every migration to a fresh Postgres, then runs the pgTAP
      # suite in supabase/tests. A failing isolation test blocks the merge.
      - run: supabase db start
      - run: supabase test db
